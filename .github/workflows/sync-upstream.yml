name: Sync upstream mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Mirror upstream branches and tags
        if: ${{ env.SYNC_TOKEN != '' }}
        run: |
          set -e
          git clone --bare https://github.com/hermeshai/hermesh.git upstream.git
          cd upstream.git
          git push "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

# Fork sync removed 2026-11-17 (owner ruling): samir2015dzh/hermesh no longer
# tracks upstream continuously. Upstream intake is selective, by work order in
# the hermesh-handover repo. This workflow only keeps the anti-deletion mirror
# of upstream branches/tags.
